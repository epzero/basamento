# Package graph, enforced by `go tool gate layering` (production and test
# imports from go list plus build-excluded .go files; ADR-0018). Canonical; the
# table in docs/architecture/overview.md §3 is derived from it. A layer may
# always import itself and its own sub-packages. A sub-package listed here is a
# layer of its own (the longest match wins): flow and model stay free of
# package runtime, while flow/host and model/node hold the flow code that needs
# it (ADR-0011).
# Change this file only with an ADR.
module: github.com/epzero/basamento

layers:
  core:             []
  platform:         [core]
  expr:             [core]
  stream:           [core, platform]
  model:            [core, platform, expr]
  model/node:       [core, platform, expr, model, runtime]
  prompt:           [core]
  flow:             [core, expr]
  flow/host:        [core, expr, flow, runtime]
  runtime:          [core]
  runtime/local:    [core, runtime, flow]
  runtime/temporal: [core, runtime, flow, platform]
  tool:             [core, platform]
  agent:            [core, model, prompt, tool, runtime]
  auth:             [core, platform, expr]
  api:              [core, platform, stream, model, flow, runtime, agent, tool, auth]
  cmd/kit:          [core, platform, expr, stream, model, prompt, flow, runtime, agent, tool, auth, api, internal/config]
  tools/gate:         [internal/gate]
  internal/gate:    []
  internal/bdd:     [core, platform, expr, stream, model, prompt, flow, runtime, agent, tool, auth, api, internal/config]
  internal/config:    [core]

# Listed packages are test support (ADR-0018): importable from `_test.go` files in
# any layer and from the packages named in test_only_allowed_from. From any other
# non-test file, including build-constraint-excluded sources, they are violations.
test_only: [core/coretest, internal/bdd]
test_only_allowed_from: [internal/bdd]

# Durable-execution vendors stay behind runtime implementations; flow code and
# the agent loop must remain runtime-neutral (ADR-0002). Rules apply per layer,
# so a layer split out of another one needs its own line.
deny_external:
  core:       [go.temporal.io/]
  flow:       [go.temporal.io/]
  flow/host:  [go.temporal.io/]
  agent:      [go.temporal.io/]
  model:      [go.temporal.io/]
  model/node: [go.temporal.io/]
  runtime:    [go.temporal.io/]
  internal/config:
    - go.temporal.io/
    - gocloud.dev/
    - github.com/jackc/pgx/
    - modernc.org/
    - github.com/nats-io/
    - github.com/tink-crypto/
    - github.com/aws/
    - cloud.google.com/
    - github.com/Azure/
