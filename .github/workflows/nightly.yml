name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  line:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Go release line from go.mod
        id: gover
        run: |
          line=$(sed -n 's/^go \([0-9]*\.[0-9]*\)\.[0-9]*$/\1/p' go.mod)
          if [ -z "$line" ]; then
            echo "no go release line in go.mod" >&2
            exit 1
          fi
          echo "line=$line" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.gover.outputs.line }}
          check-latest: true
      - name: Install gate tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: govulncheck
        run: |
          set -e
          roots="$(go tool gate module-roots)"
          test -n "$roots"
          for dir in $roots; do
            (cd "$dir" && govulncheck ./...)
          done

  flake-hunt:
    # Repeated runs look for nondeterminism; a flaky scenario is quarantined
    # with @quarantine @issue:<key> @until:<date> (docs/engineering/bdd-convention.md).
    # The default go test package timeout (10m) is shorter than ten BDD runs under
    # -race; the step sets -timeout 90m (the job still ends at GitHub's 6h limit).
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GATE_STRICT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Postgres bundle cache location and version
        run: |
          echo "BDD_POSTGRES_CACHE_DIR=$RUNNER_TEMP/embedded-postgres-cache" >> "$GITHUB_ENV"
          echo "PG_MODULE_VERSION=$(go list -m -f '{{.Version}}' github.com/fergusstrange/embedded-postgres/v2)" >> "$GITHUB_ENV"

      - name: Postgres bundle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.BDD_POSTGRES_CACHE_DIR }}
          key: embedded-postgres-${{ env.PG_MODULE_VERSION }}-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            embedded-postgres-${{ env.PG_MODULE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Prefetch Postgres bundles
        run: make pg-prefetch

      - run: go test -race -count=10 -timeout 90m ./...

  slow-lanes:
    # @slow scenarios; @live joins once credentials exist.
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GATE_STRICT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Postgres bundle cache location and version
        run: |
          echo "BDD_POSTGRES_CACHE_DIR=$RUNNER_TEMP/embedded-postgres-cache" >> "$GITHUB_ENV"
          echo "PG_MODULE_VERSION=$(go list -m -f '{{.Version}}' github.com/fergusstrange/embedded-postgres/v2)" >> "$GITHUB_ENV"

      - name: Postgres bundle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.BDD_POSTGRES_CACHE_DIR }}
          key: embedded-postgres-${{ env.PG_MODULE_VERSION }}-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            embedded-postgres-${{ env.PG_MODULE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Prefetch Postgres bundles
        run: make pg-prefetch

      - run: go test -count=1 -timeout 30m ./internal/bdd/
        env:
          BDD_TAGS: "@slow && ~@planned && ~@quarantine"

  eval-lane:
    # @eval scenarios: the recorded per-case judge scores replayed against the
    # thresholds in specs/presets/eval.feature. CODEGEN_EVAL_DIR names the
    # recordings the nightly run fills from live model runs.
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GATE_STRICT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Postgres bundle cache location and version
        run: |
          echo "BDD_POSTGRES_CACHE_DIR=$RUNNER_TEMP/embedded-postgres-cache" >> "$GITHUB_ENV"
          echo "PG_MODULE_VERSION=$(go list -m -f '{{.Version}}' github.com/fergusstrange/embedded-postgres/v2)" >> "$GITHUB_ENV"

      - name: Postgres bundle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.BDD_POSTGRES_CACHE_DIR }}
          key: embedded-postgres-${{ env.PG_MODULE_VERSION }}-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            embedded-postgres-${{ env.PG_MODULE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Prefetch Postgres bundles
        run: make pg-prefetch

      - run: go test -count=1 -timeout 30m ./internal/bdd/
        env:
          BDD_TAGS: "@eval && ~@planned && ~@quarantine"
          CODEGEN_EVAL_DIR: ${{ github.workspace }}/presets/codegen/evals

  release-readiness:
    # Reports P0 scenarios still awaiting human acceptance; informational at night.
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Informational: pending P0 acceptances are expected; blocking signal is line. The reviewer lead reads the schedule via go tool gate nightly (docs/engineering/qa-gate.md, "Who reads the nightly").
      - name: release-check
        continue-on-error: true
        run: go tool gate release-check
