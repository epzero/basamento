name: gate

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      GATE_STRICT: "1"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # red→green and buf breaking compare against the base

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Postgres bundle cache location and version
        run: |
          echo "BDD_POSTGRES_CACHE_DIR=$RUNNER_TEMP/embedded-postgres-cache" >> "$GITHUB_ENV"
          echo "PG_MODULE_VERSION=$(go list -m -f '{{.Version}}' github.com/fergusstrange/embedded-postgres/v2)" >> "$GITHUB_ENV"

      - name: Postgres bundle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.BDD_POSTGRES_CACHE_DIR }}
          key: embedded-postgres-${{ env.PG_MODULE_VERSION }}-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            embedded-postgres-${{ env.PG_MODULE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Install gate tools
        run: |
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Determine base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "ref=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Prefetch Postgres bundles
        run: make pg-prefetch

      - name: make gate
        run: make gate BASE="${{ steps.base.outputs.ref }}"

      - name: Gate report
        if: always()
        run: |
          mkdir -p .gate
          go tool gate spec trace -json > .gate/trace.json || true
          go tool gate spec queue > .gate/human-queue.txt || true
          {
            echo "### Gate"
            echo
            echo "Human review queue (P0 first):"
            echo '```'
            head -20 .gate/human-queue.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-report
          path: .gate/
