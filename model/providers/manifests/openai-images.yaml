# OpenAI image generation. One request, one reply: every image arrives as a
# URL, which the model node ingests by content hash (REQ-MODEL-008). The
# credential is a reference; the value stays in the vault.
name: openai-images
locality: cloud
protocol: single
http:
  base_url: https://api.openai.com/v1
  credential: cred://openai
  auth:
    header: Authorization
    scheme: Bearer
  start:
    method: POST
    path: /images/generations
    body: |
      {
        "model": "dall-e-3",
        "prompt": (.text.prompt // .params.prompt // ""),
        "n": (.params.n // 1),
        "size": (.params.size // "1024x1024"),
        "response_format": "url"
      }
    response:
      outputs: '.data | map({url: .url, media: "image", mime: "image/png"})'
models:
  - id: openai/dall-e-3
    caps: [image.generate]
    params_schema:
      type: object
      properties:
        prompt:
          type: string
        n:
          type: integer
          minimum: 1
          maximum: 1
        size:
          type: string
          enum: [1024x1024, 1792x1024, 1024x1792]
      required: [prompt]
    inputs:
      - name: prompt
        media: text
        required: true
